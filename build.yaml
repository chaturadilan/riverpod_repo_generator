targets:
  $default:
    builders:
      riverpod_repo:
        enabled: true
        generate_for:
          exclude:
            - "**/*.repo.g.dart"
      riverpod_generator:riverpod_generator:
        enabled: true
        generate_for:
          include:
            - "**/*.dart"
          exclude:
            - "**/*.repo.g.dart"

builders:
  riverpod_repo:
    import: "package:riverpod_repo/riverpod_repo.dart"
    builder_factories: ["generateRiverpodRepo"]
    build_extensions: { ".dart": [".repo.g.dart"] }
    auto_apply: dependents
    build_to: source
