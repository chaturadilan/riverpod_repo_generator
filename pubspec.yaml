name: riverpod_repo
description: >-
  Generate Riverpod FutureProvider, StreamProvider, and Provider declarations
  from repository interfaces using the repository pattern.
version: 5.1.2
homepage: https://dilan.me
repository: https://github.com/chaturadilan/riverpod_repo_generator
issue_tracker: https://github.com/chaturadilan/riverpod_repo_generator/issues
documentation: https://github.com/chaturadilan/riverpod_repo_generator#readme

environment:
  sdk: ^3.12.0

topics:
  - riverpod
  - code-generation
  - repository-pattern
  - flutter
  - dart

dependencies:
  build: ^4.0.10
  source_gen: ^4.2.4
  recase: ^4.1.0
  analyzer: ">=13.3.0 <15.0.0"
  riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.2
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
